<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泰拉瑞亞：通往困難模式</title>
<style>
@font-face{font-family:FP;src:url(assets/font.woff2) format("woff2");font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f}
body{font-family:FP,"PingFang TC","Noto Sans TC",monospace;color:#fff;-webkit-font-smoothing:none;font-smooth:never;overscroll-behavior:none}
button,input{font-family:inherit}
img{image-rendering:pixelated;image-rendering:crisp-edges}
#app{max-width:440px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg,#05060f);transition:background .6s}
.ts{text-shadow:2px 2px 0 #000}
/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex-shrink:0}
.hearts{display:flex;flex-wrap:wrap;gap:2px;width:132px}
.hearts img{width:12px}
.area{flex:1;text-align:center;font-size:24px;color:#cfd8ff;text-shadow:2px 2px 0 #000}
.buffs{display:flex;gap:4px}
.buffs img{width:24px}
.gbtn{width:44px;height:44px;border-radius:6px;border:3px solid #0f1638;background:#3f5297;box-shadow:inset 0 0 0 2px #6a7cc9;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.gbtn img{width:30px}
/* boss bar */
.boss{margin:2px 14px 0;display:flex;align-items:center;gap:8px;flex-shrink:0}
.boss img{width:30px}
.bar{flex:1;height:22px;background:#1a0b0b;border:3px solid #0f0f22;border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(#ff5a5a,#b81c1c);transition:width .8s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;text-shadow:1px 1px 0 #000;font-style:normal}
/* main */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px;position:relative}
main.center{justify-content:center}
.say{font-size:24px;line-height:1.45;text-shadow:2px 2px 0 #000}
.c{text-align:center}
.dim{color:#9fb0e8}
.small{font-size:12px;line-height:1.6;color:#9fb0e8;text-shadow:1px 1px 0 #000}
.banner{font-size:36px;line-height:1.25;text-align:center;text-shadow:3px 3px 0 #000}
.title{font-size:48px;text-align:center;color:#ffd75a;text-shadow:3px 3px 0 #6b3d00,5px 5px 0 #000}
.gold{color:#ffd75a}.purple{color:#b46cff}.red{color:#ff6a6a}.green{color:#8fe39a}.orange{color:#ff9b3d}
.panel{background:rgba(23,30,74,.93);border:3px solid #080b20;box-shadow:inset 0 0 0 3px #3a4896;border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.mid{display:flex;justify-content:center;align-items:center;gap:14px}
.btn{font-size:24px;color:#fff;background:#4f63c4;border:3px solid #18214f;box-shadow:inset 0 3px 0 #8a9cf0;border-radius:6px;min-height:52px;padding:0 16px;cursor:pointer;text-shadow:2px 2px 0 #000;flex-shrink:0}
.btn:active{transform:translateY(2px)}
.btn.gold{background:#c28a22;box-shadow:inset 0 3px 0 #ffe08a}
.btn.red{background:#b4413a;box-shadow:inset 0 3px 0 #ff9a8a}
.btn.dark{background:#2b3a7a;box-shadow:inset 0 3px 0 #5468b8}
.btn.wide{width:100%}
.inp{font-size:24px;background:#0f1638;color:#fff;border:3px solid #3a4896;border-radius:6px;padding:10px 12px;flex:1;min-width:0;outline:none}
.inp:focus{border-color:#ffd75a}
.msg{min-height:24px;font-size:24px;text-shadow:2px 2px 0 #000}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.guide{display:flex;gap:10px;align-items:flex-start}
.guide img{width:40px;flex-shrink:0}
.guide .panel{font-size:24px;line-height:1.4;padding:10px 12px;text-shadow:2px 2px 0 #000}
.wait{font-size:12px;color:#8f86c9;text-align:center;text-shadow:1px 1px 0 #000;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.4}}
/* slots */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{height:84px;background:#3f5297;border:3px solid #18214f;box-shadow:inset 0 0 0 2px #6a7cc9;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#5f6fae;font-size:24px;padding:0}
.slot.got{background:#5b6fc2;color:#ffd75a;text-shadow:2px 2px 0 #000}
.slot img{width:22px}
/* toolbar */
.toolbar{display:flex;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:rgba(5,8,25,.75);border-top:3px solid #0f1638;flex-shrink:0}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:#3f5297;border:3px solid #0f1638;box-shadow:inset 0 0 0 2px #6a7cc9;border-radius:6px;color:#fff;font-size:24px;cursor:pointer;text-shadow:2px 2px 0 #000}
.tool img{width:30px}.tool span{font-size:12px}
.tool.off{background:#2c3566;box-shadow:inset 0 0 0 2px #3a4580;color:#5f6aa0;cursor:default}
.tool.off img{opacity:.18;filter:grayscale(1)}
.tool.glow{border-color:#ffd75a;animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px #ffe08a,0 0 16px #ffd75a}}
/* modal */
#modal{position:absolute;inset:0;background:rgba(0,0,10,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal.on{display:flex}
.mbox{width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;opacity:0;transition:opacity .3s;font-size:24px;padding:10px 16px;white-space:nowrap}
#toast.on{opacity:1}
/* radio */
#radio,#compass{position:absolute;left:10px;right:10px;bottom:84px;z-index:15;display:none}
#radio.on,#compass.on{display:block}
#spec{width:100%;height:200px;display:block;background:#000;border:3px solid #0f1638;image-rendering:pixelated}
/* animations */
.float{animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.bounce{animation:bounce 1.1s ease-in-out infinite;transform-origin:bottom}
@keyframes bounce{0%,100%{transform:scale(1.06,.92)}50%{transform:scale(.95,1.06) translateY(-14px)}}
.spin{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fall{position:absolute;top:-60px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(900px)}}
.bee{position:absolute;pointer-events:none;animation:buzz 3s ease-in-out infinite alternate}
@keyframes buzz{0%{transform:translate(0,0)}33%{transform:translate(40px,-20px) scaleX(-1)}66%{transform:translate(-30px,15px)}100%{transform:translate(20px,-10px) scaleX(-1)}}
.flash{animation:flash .6s}
@keyframes flash{0%{filter:brightness(4) saturate(0)}100%{filter:none}}
.hit{animation:hit .6s}
@keyframes hit{0%,100%{filter:none;transform:none}30%{filter:brightness(2.5) sepia(1) hue-rotate(-40deg);transform:translateX(6px)}}
.fade{animation:fadein .8s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
/* wof */
.stage{position:relative;height:360px;flex-shrink:0}
.wall{position:absolute;right:-30px;top:0;bottom:0;width:150px;background:repeating-linear-gradient(0deg,#5a1a24 0 10px,#6e2230 10px 20px);border-left:6px solid #3a0c14}
.sock{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0;text-shadow:2px 2px 0 #000}
.sock .hole{width:36px;height:40px;border:3px dashed #6b7099;border-radius:3px;background:rgba(0,0,0,.25)}
.sock img{width:36px;height:40px;object-fit:contain}
.levers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hearts" id="hearts"></div>
    <div class="area" id="area"></div>
    <div class="buffs" id="buffs"></div>
    <button class="gbtn" id="mbtn" aria-label="音樂開關" style="width:auto;padding:0 6px;font-size:12px;color:#fff;font-family:FP"></button>
    <button class="gbtn" id="gbtn" aria-label="嚮導選單"><img src="assets/guideicon.png" alt=""></button>
  </header>
  <div id="bossw"></div>
  <main id="main"></main>
  <div id="radio"><div class="panel">
    <div class="row"><img src="assets/radio.png" alt="" style="width:34px"><div class="say" style="flex:1">天氣收音機</div><button class="btn dark" id="radioClose" style="min-height:40px">關閉</button></div>
    <canvas id="spec" width="336" height="200"></canvas>
    <div class="small" id="radioNote">能讓你看見聲音。</div>
  </div></div>
  <div id="compass"><div class="panel">
    <div class="row"><img src="assets/compass.png" alt="" style="width:34px"><div class="say" style="flex:1">羅盤</div><button class="btn dark" id="compassClose" style="min-height:40px">關閉</button></div>
    <canvas id="dial" width="240" height="240" style="width:240px;height:240px;margin:0 auto;display:block"></canvas>
    <div class="say c gold" id="heading">－</div>
    <button class="btn wide gold" id="compassStart">開始使用羅盤</button>
    <div class="small" id="compassNote">手機平放，上緣對著你要走的方向。方向怪怪的話，拿著手機在空中畫幾次 8 字。</div>
  </div></div>
  <nav class="toolbar" id="toolbar"></nav>
  <div id="modal"><div class="mbox" id="mbox"></div></div>
  <div id="toast" class="panel"></div>
</div>
<script>
/* ============ 勘查後要改的地方都在這裡 ============ */
const CFG = {
  guidePin: '0000',                       // 嚮導密碼：改成你自己的 4 位數
  photos: [                               // 克眼 6 個拍攝點的檢查問題（勘查後填）
    {q:'照片 1：（勘查後填檢查問題）　示範答案：1', a:['1']},
    {q:'照片 2：（勘查後填檢查問題）　示範答案：2', a:['2']},
    {q:'照片 3：（勘查後填檢查問題）　示範答案：3', a:['3']},
    {q:'照片 4：（勘查後填檢查問題）　示範答案：4', a:['4']},
    {q:'照片 5：（勘查後填檢查問題）　示範答案：5', a:['5']},
    {q:'照片 6：（勘查後填檢查問題）　示範答案：6', a:['6']},
  ],
  lensArrows: ['↑3','←2','↓6','→4','↑3','←1'],
  eocEnd: {q:'到了嗎？那裡有什麼？（勘查後填）　示範答案：長椅', a:['長椅']},
  goblinWest: {options:['垃圾桶','路燈','雕塑','飲水機'], a:'路燈'},   // 往西 20 步有什麼（勘查後填）
  gpsStart: '○○',                          // GPS 起點（勘查後填）
  larvaText: '幼蟲在第七根欄杆下',            // 頻譜裡的字（勘查後換）
  spawn: {q:'出生點的告示牌上寫著什麼？（勘查後填）　示範答案：內惟埤', a:['內惟埤']},
};
/* ================================================= */

const STEPS=['intro','ready','slime','king','lens','awake','mouth','eocdead','goblin','gps','chest','truth','choose','bocdead','jungle','queen','rest','oldman','skel','head','skeldead','hell','forge','nights','wof','hard','spawn','ending'];
const LABEL={intro:'序章',ready:'序章・等史萊姆雨',slime:'史萊姆雨',king:'史萊姆王',lens:'克眼・收集透鏡',awake:'克眼・視力表',mouth:'克眼・牙齒',eocdead:'克眼打倒・等哥布林',goblin:'哥布林入侵',gps:'GPS 導航',chest:'地下金箱・等飛眼怪',truth:'克腦・飛眼怪',choose:'克腦・選真身',bocdead:'克腦打倒・等叢林',jungle:'叢林・收音機',queen:'蜂王・字盤',rest:'休息・等地牢',oldman:'骷髏王・老人',skel:'骷髏王・兩隻手',head:'骷髏王・頭',skeldead:'骷髏王打倒・等地獄',hell:'地獄・獄石',forge:'獄火熔爐・等合成',nights:'永夜刃・等犧牲',wof:'血肉牆',hard:'困難模式',spawn:'回到出生點',ending:'重生點'};
const TRIG=[['史萊姆雨','slime'],['哥布林入侵','goblin'],['地下金箱','chest'],['飛眼怪','truth'],['進入叢林','jungle'],['進入地牢','oldman'],['進入地獄','hell'],['合成永夜刃','nights'],['嚮導之死','wof'],['顯示電路圖','circuit']];
const BG={day:'linear-gradient(180deg,#3a63c9 0%,#6f9ae8 55%,#9bc3f2 82%,#5d9a3a 82%,#4a7d2c 100%)',night:'linear-gradient(180deg,#05060f 0%,#11152b 60%,#1c2140 100%)',crimson:'linear-gradient(180deg,#14040a 0%,#2e0a16 55%,#4a1222 100%)',jungle:'linear-gradient(180deg,#0a1a10 0%,#16361c 55%,#24502a 100%)',dungeon:'repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 56px),linear-gradient(180deg,#0d1430,#1b2552)',hell:'linear-gradient(180deg,#1a0306 0%,#3a0a10 60%,#6a1a12 100%)',hard:'linear-gradient(180deg,#120624 0%,#2a1050 50%,#3d1a6a 100%)',dawn:'linear-gradient(180deg,#1b2a6a 0%,#6a5aa8 45%,#f0a070 85%,#ffd59a 100%)'};
const AREA={intro:['地表','day'],ready:['地表','day'],slime:['地表','day'],king:['地表','day'],lens:['地表・夜晚','night'],awake:['地表・夜晚','night'],mouth:['地表・夜晚','night'],eocdead:['地表・夜晚','night'],goblin:['地表','day'],gps:['地表','day'],chest:['地下','night'],truth:['猩紅之地','crimson'],choose:['猩紅之地','crimson'],bocdead:['猩紅之地','crimson'],jungle:['叢林','jungle'],queen:['叢林','jungle'],rest:['叢林','jungle'],oldman:['地牢','dungeon'],skel:['地牢','dungeon'],head:['地牢','dungeon'],skeldead:['地牢','dungeon'],hell:['地獄','hell'],forge:['地獄','hell'],nights:['地獄','hell'],wof:['地獄','hell'],hard:['困難模式','hard'],spawn:['出生點','dawn'],ending:['出生點','dawn']};

/* ---------- state ---------- */
const KEY='terraria-bday-2026';
const FRESH=()=>({step:'intro',lenses:[],goblinStart:0,wave:0,skel:{l:0,r:0},wof:{lev:0,sw:[0,0,0,0,0,0,0]},sacSeen:0,brainsGone:[],spawnSet:0});
let S=FRESH();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(FRESH(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const idx=s=>STEPS.indexOf(s);
const reached=s=>idx(S.step)>=idx(s);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const I=(k,w,st='',cls='')=>`<img src="assets/${k}.png" alt="" class="${cls}" style="width:${w}px;${st}">`;
const norm=s=>(s||'').normalize('NFKC').replace(/\s+/g,'').replace(/[「」『』"'。.，,、！!？?：:]/g,'').toLowerCase();
const anyOf=(v,list)=>list.map(norm).includes(norm(v));
const perm=(v,t)=>{const d=norm(v).replace(/\D/g,'');return d.length===t.length&&[...d].sort().join('')===[...t].sort().join('')};
const say=(t,cls='')=>`<div class="say ${cls}">${t}</div>`;
const banner=(t,cls)=>`<div class="banner ${cls} fade">${t}</div>`;
const guideSay=t=>`<div class="guide">${I('guide',40)}<div class="panel">${t}</div></div>`;
const wait=t=>`<div class="wait">${t||'（等嚮導……）'}</div>`;
function ask(id,label,ph,btn){return `<form class="panel" data-form="${id}"><label class="say" for="f_${id}">${label}</label><div class="row"><input class="inp" id="f_${id}" placeholder="${ph||'輸入答案'}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">${btn||'確定'}</button></div><div class="msg red" id="m_${id}"></div></form>`}
let toastT;function toast(html){const t=$('#toast');t.innerHTML=html;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(html,buttons){$('#mbox').innerHTML=`<div class="panel">${html}</div>`+(buttons||[]).map((b,i)=>`<button class="btn wide ${b.cls||''}" data-mb="${i}">${b.t}</button>`).join('');$('#modal').classList.add('on');
  $('#mbox').querySelectorAll('[data-mb]').forEach(el=>el.onclick=()=>{const b=buttons[+el.dataset.mb];if(!b.keep)closeModal();b.f&&b.f()});}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
function reward(title,items,line,next){modal(`<div class="banner green">${title}</div><div class="mid" style="flex-wrap:wrap">${items.map(k=>I(k,48)).join('')}</div>${say(line,'c')}`,[{t:'好',f:next}])}
function go(step){S.step=step;save();render()}

/* ---------- forms ---------- */
const FORMS={};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const id=f.dataset.form;const inp=f.querySelector('input');const r=FORMS[id]&&FORMS[id](inp.value,inp);
  const m=document.getElementById('m_'+id);
  if(r===true){inp.blur();}else{f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');if(m)m.textContent=(typeof r==='string')?r:'不對喔。';}});

/* ---------- screens ---------- */
const SCR={};
SCR.intro=()=>({html:`<div class="mid" style="flex-direction:column;gap:4px;margin-top:10px"><div class="title">泰拉瑞亞</div><div class="say">通往困難模式</div></div>
<div class="panel"><div class="say" id="gen">正在生成世界……</div><div class="bar" style="height:18px"><i id="genbar" style="width:0;background:#46c35a"></i></div></div>
<div id="afterGen" style="display:none;flex-direction:column;gap:14px">${guideSay('你好，我是嚮導。這個世界剛生成，但有些東西已經醒了。')}${ask('card','第一題：你手上那張卡叫什麼？')}</div>`,
 mount(){const bar=$('#genbar');setTimeout(()=>bar.style.width='100%',50);setTimeout(()=>{$('#gen').textContent='世界生成完畢';const a=$('#afterGen');a.style.display='flex';},1100)}});
FORMS.card=v=>{if(anyOf(v,['角色卡','角色','人物卡','charactercard'])){go('ready');return true}};
SCR.ready=()=>({center:1,html:`${banner('世界生成完畢','green')}<div class="mid">${I('guide',52,'','float')}</div>${guideSay('很好，你學會了。你出生時帶著的羅盤，就在下面的工具列。之後拿到的小方格，都貼到你的角色卡上。跟著我走吧。')}${wait()}`});

SCR.slime=()=>({html:`<div class="stars">${[...Array(9)].map((_,i)=>`<img src="assets/slime.png" class="fall" alt="" style="width:${[36,48,40,56,32,44,52,38,46][i]}px;left:${(i*41+13)%340}px;animation-duration:${3+i%4}s;animation-delay:${-(i*0.7)}s">`).join('')}</div>
<div style="flex:1"></div>${banner('史萊姆雨！','')}<div class="say c">天上掉下來的凝膠，拼成了一張圖。<br>跟嚮導拿那張紙。</div>${ask('crown','解出來的圖案是？')}`});
FORMS.crown=v=>{if(anyOf(v,['金冠','王冠','皇冠','冠','皇冠','crown','goldcrown'])){modal(`<div class="say c">合成</div><div class="mid">${I('crown',60)}<div class="say">＋ 20 凝膠</div></div><div class="say c">↓</div><div class="mid">${I('slimecrown',60)}</div><div class="say c gold">史萊姆王冠</div>`,[{t:'使用',cls:'gold',f:()=>go('king')}]);return true}};
SCR.king=()=>({boss:['kingicon','史萊姆王',100],html:`${banner('史萊姆王已經甦醒！','purple')}<div class="mid" style="height:200px;align-items:flex-end">${I('king',210,'','bounce')}</div>${say('牠把寶藏吞下去了。<br>跟嚮導拿那罐史萊姆，把肚子裡的東西挖出來。','c')}${ask('ninja','史萊姆王肚子裡的是？')}`});

const DSEG={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
const BONE0=()=>[[...'abcdef'],[...'acdefg'],[...'bc'],[...'abcdg']];
let bones=BONE0(),picked=null,moved=false;
function bonePanel(){return `<div class="panel"><div class="say">右手：骨頭算式</div><div class="say dim" style="font-size:24px">只移動一根骨頭，讓等式成立。<br>點一根骨頭拿起來，再點空位放下。</div><svg id="bones" viewBox="0 0 330 120" style="width:100%;background:#0b1028;border:3px solid #0f1638;border-radius:4px;touch-action:manipulation"></svg><div class="row"><div class="msg red" id="m_bone" style="flex:1"></div><button class="btn dark" data-a="boneReset">重來</button></div></div>`}
function segRect(ox,oy,s){const L=30,T=8;const P={a:[0,0,L,0],b:[L,0,L,L],c:[L,L,L,2*L],d:[0,2*L,L,2*L],e:[0,L,0,2*L],f:[0,0,0,L],g:[0,L,L,L]}[s];const [x1,y1,x2,y2]=P.map((v,i)=>v+(i%2?oy:ox));
 return x1===x2?{x:x1-T/2,y:y1+4,w:T,h:y2-y1-8,v:1}:{x:x1+4,y:y1-T/2,w:x2-x1-8,h:T,v:0}}
function boneSVG(r,cls,attrs){const T=8;const k=[];if(r.v){k.push([r.x+T*.15,r.y],[r.x+T*.85,r.y],[r.x+T*.15,r.y+r.h],[r.x+T*.85,r.y+r.h])}else{k.push([r.x,r.y+T*.15],[r.x,r.y+T*.85],[r.x+r.w,r.y+T*.15],[r.x+r.w,r.y+T*.85])}
 return `<g class="${cls}" ${attrs||''}><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="3"/>${k.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.2"/>`).join('')}</g>`}
function drawBones(){const svg=$('#bones');if(!svg)return;const OX=[14,92,196,252],OY=26;let h=`<style>.bn rect,.bn circle{fill:#e8dcc0;stroke:#6b5a3a;stroke-width:1.5}.bn.sel rect,.bn.sel circle{fill:#ffd75a;stroke:#fff}.bn.fix rect,.bn.fix circle{fill:#b8ab8e}.slot0 rect{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.22);stroke-dasharray:3 3}.slot0 circle{display:none}</style>`;
 bones.forEach((segs,d)=>{for(const s of 'abcdefg'){const r=segRect(OX[d],OY,s);const on=segs.includes(s);const sel=picked&&picked[0]===d&&picked[1]===s;
   h+=on?boneSVG(r,'bn'+(sel?' sel':''),`data-b="${d}${s}" style="cursor:pointer"`):boneSVG({x:r.x+1,y:r.y+1,w:r.w-2,h:r.h-2,v:r.v},'slot0',`data-e="${d}${s}" style="cursor:pointer"`)}});
 h+=boneSVG({x:54,y:51,w:24,h:8,v:0},'bn fix')+boneSVG({x:62,y:43,w:8,h:24,v:1},'bn fix');
 h+=boneSVG({x:150,y:44,w:28,h:8,v:0},'bn fix')+boneSVG({x:150,y:58,w:28,h:8,v:0},'bn fix');
 svg.innerHTML=h;
 svg.querySelectorAll('[data-b]').forEach(g=>g.addEventListener('click',()=>{if(moved)return;const d=+g.dataset.b[0],s=g.dataset.b[1];picked=(picked&&picked[0]===d&&picked[1]===s)?null:[d,s];drawBones()}));
 svg.querySelectorAll('[data-e]').forEach(g=>g.addEventListener('click',()=>{if(moved||!picked)return;const d=+g.dataset.e[0],s=g.dataset.e[1];bones[picked[0]]=bones[picked[0]].filter(x=>x!==picked[1]);bones[d].push(s);picked=null;moved=true;drawBones();checkBones()}))}
function checkBones(){const ds=bones.map(b=>{const k=Object.keys(DSEG).find(n=>[...DSEG[n]].sort().join('')===[...b].sort().join(''));return k===undefined?null:+k});
 if(!ds.includes(null)&&ds[0]+ds[1]===ds[2]*10+ds[3]){setTimeout(()=>{S.skel.r=1;save();handDrop('右手')},500)}
 else{$('#m_bone').textContent=ds.includes(null)?'那不是數字。按「重來」。':'等式不成立。按「重來」。'}}

/* ---------- jungle audio + radio ---------- */
const audio={ctx:null,src:null,an:null,buf:null,on:false,
 async build(){const sr=44100,dur=8;const oc=new OfflineAudioContext(1,sr*dur,sr);
  const out=oc.createGain();out.gain.value=.9;out.connect(oc.destination);
  [[228,.5,6.3],[241,.9,7.1],[219,1.6,5.4]].forEach(([f,ph,vr],k)=>{const o=oc.createOscillator();o.type='sawtooth';o.frequency.value=f;
   const l=oc.createOscillator();l.frequency.value=vr;const lg=oc.createGain();lg.gain.value=9;l.connect(lg);lg.connect(o.frequency);
   const lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.Q.value=1.5;
   const g=oc.createGain();g.gain.value=0;for(let t=0;t<dur;t+=0.05){g.gain.setValueAtTime(.035*(0.55+0.45*Math.sin(t*1.7+ph+k)),t)}
   o.connect(lp);lp.connect(g);g.connect(out);o.start(0);l.start(0)});
  try{await document.fonts.load('12px FP',CFG.larvaText)}catch(e){}
  const chars=[...CFG.larvaText],cw=12,gap=3,n=chars.length;const cv=document.createElement('canvas');cv.width=n*(cw+gap);cv.height=12;
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.font='12px FP';cx.textBaseline='top';chars.forEach((ch,i)=>cx.fillText(ch,i*(cw+gap),0));
  const px=cx.getImageData(0,0,cv.width,12).data;const cols=cv.width,rows=12;
  const t0=.6,textDur=Math.min(6.6,n*.72),colDur=textDur/cols,fTop=8800,fBot=3600,band=(fTop-fBot)/rows;
  for(let r=0;r<rows;r++){const g=oc.createGain();g.gain.value=0;g.connect(out);
   for(let s=0;s<3;s++){const o=oc.createOscillator();o.frequency.value=fTop-(r+.2+s*.3)*band;o.connect(g);o.start(0)}
   let prev=0;for(let c=0;c<=cols;c++){const on=c<cols&&px[(r*cols+c)*4+3]>110?1:0;if(on!==prev){const t=t0+c*colDur;g.gain.setValueAtTime(prev*.011,t);g.gain.linearRampToValueAtTime(on*.011,t+.006);prev=on}}}
  this.buf=await oc.startRendering()},
 async start(){try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();await this.ctx.resume();if(!this.buf)await this.build();
   this.stop(true);const s=this.ctx.createBufferSource();s.buffer=this.buf;s.loop=true;const an=this.ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.15;an.minDecibels=-100;an.maxDecibels=-30;
   s.connect(an);an.connect(this.ctx.destination);s.start();this.src=s;this.an=an;this.on=true}catch(e){this.on=true;toast('這台手機放不出聲音');}},
 stop(keep){if(this.src){try{this.src.stop()}catch(e){}this.src=null}if(!keep)this.on=false}};
let radioRAF=0,lastT=0;
const PAL=(()=>{const p=[];for(let i=0;i<256;i++){const t=i/255;const r=Math.min(255,Math.round(255*Math.min(1,t*2.2)));const g=Math.round(255*Math.max(0,Math.min(1,(t-.38)*1.9)));const b=Math.round(255*(t<.35?t*1.6:Math.max(0,(.6-t)*1.4)+Math.max(0,(t-.85)*4)));p.push([r,g,Math.min(255,b)])}return p})();
function openRadio(){$('#radio').classList.add('on');const cv=$('#spec'),cx=cv.getContext('2d');cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
 const live=(S.step==='jungle'||S.step==='queen')&&audio.on&&audio.src&&audio.an;$('#radioNote').textContent=live?'能讓你看見聲音。':'能讓你看見聲音。（這裡只有雜訊）';
 const H=cv.height,W=cv.width;let data=live?new Uint8Array(audio.an.frequencyBinCount):null;const binHz=live?audio.ctx.sampleRate/audio.an.fftSize:0;const fMax=11025;let acc=0;lastT=performance.now();
 const col=cx.createImageData(1,H);
 const frame=t=>{const dt=Math.min(.1,(t-lastT)/1000);lastT=t;acc+=dt*120;let steps=Math.floor(acc);acc-=steps;
  if(steps>0){cx.drawImage(cv,-steps,0);
   if(live)audio.an.getByteFrequencyData(data);
   for(let y=0;y<H;y++){let v;if(live){const f=fMax*(1-y/H);v=data[Math.min(data.length-1,Math.round(f/binHz))]}else{v=Math.random()<.5?Math.random()*70:0}
    const c=PAL[v|0];col.data[y*4]=c[0];col.data[y*4+1]=c[1];col.data[y*4+2]=c[2];col.data[y*4+3]=255}
   for(let s=0;s<steps;s++)cx.putImageData(col,W-1-s,0)}
  radioRAF=requestAnimationFrame(frame)};radioRAF=requestAnimationFrame(frame)}
function closeRadio(silent){$('#radio').classList.remove('on');cancelAnimationFrame(radioRAF)}
$('#radioClose').onclick=()=>closeRadio();

/* ---------- zoom viewer ---------- */
function zoomer(){const v=$('#zv'),im=$('#zimg');if(!v)return;const pw=v.parentElement.clientWidth,mh=window.innerHeight*.62;const w0=Math.min(pw,mh*900/1061);v.style.width=w0+'px';v.style.height=(w0*1061/900)+'px';v.style.aspectRatio='auto';v.style.maxHeight='none';let sc=1,tx=0,ty=0;const P=new Map();let last=null,lastTap=0;
 const W=()=>v.clientWidth,H=()=>v.clientHeight;
 const apply=()=>{sc=Math.max(1,Math.min(5,sc));const iw=W()*sc,ih=im.offsetHeight/ (im._s||1)*sc;tx=Math.min(0,Math.max(W()-iw,tx));ty=Math.min(0,Math.max(H()-W()*1061/900*sc,ty));im.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`};
 const zoomAt=(f,cx,cy)=>{const ns=Math.max(1,Math.min(5,sc*f));tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;apply()};
 const rel=e=>{const r=v.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
 v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);P.set(e.pointerId,rel(e));if(P.size===1){const now=Date.now();if(now-lastTap<300){const [x,y]=rel(e);sc>1.2?(sc=1,tx=0,ty=0,apply()):zoomAt(2.5,x,y)}lastTap=now}last=null});
 v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId);const cur=rel(e);P.set(e.pointerId,cur);
  if(P.size===1){tx+=cur[0]-prev[0];ty+=cur[1]-prev[1];apply()}
  else if(P.size===2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(last){zoomAt(d/last.d,mx,my);tx+=mx-last.mx;ty+=my-last.my;apply()}last={d,mx,my}}});
 const up=e=>{P.delete(e.pointerId);last=null};v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
 v.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=rel(e);zoomAt(e.deltaY<0?1.15:1/1.15,x,y)},{passive:false});
 $('#zIn').onclick=()=>zoomAt(1.5,W()/2,H()/2);$('#zOut').onclick=()=>zoomAt(1/1.5,W()/2,H()/2);apply()}

/* ---------- music ---------- */
const MUSIC_DIR='music/';
const TRACK={intro:'Music-Overworld_Day',ready:'Music-Overworld_Day',slime:'Music-Slime_Rain',king:'Music-Slime_Rain',lens:'Music-Overworld_Day',awake:'Music-克眼',mouth:'Music-克眼',eocdead:'Music-Overworld_Day',goblin:'Music-Goblin_Army',gps:'Music-Overworld_Day',chest:'Music-Underground',truth:'Music-Underground_Crimson',choose:'Music-克腦',bocdead:'Music-Underground_Crimson',jungle:null,queen:'Music-Jungle',rest:'Music-Jungle',oldman:'Music-Dungeon',skel:'Music-Dungeon',head:'Music-Dungeon',skeldead:'Music-Dungeon',hell:'Music-Underworld',forge:'Music-Underworld',nights:'Music-Underworld',wof:'Music-肉牆',hard:'Music-Overworld_Day',spawn:'Music-Overworld_Day',ending:'Music-Overworld_Day'};
const bgm={el:new Audio(),cur:null,unlocked:false,muted:false};
bgm.el.loop=true;bgm.el.volume=.55;
try{bgm.muted=localStorage.getItem(KEY+'-mute')==='1'}catch(e){}
function bgmFor(step){const t=TRACK[step];if(bgm.muted||!bgm.unlocked||!t){bgm.el.pause();if(!t)bgm.cur=null;return}
 if(bgm.cur===t){if(bgm.el.paused)bgm.el.play().catch(()=>{});return}
 bgm.cur=t;const v0=bgm.el.volume;let k=0;const f=setInterval(()=>{k++;bgm.el.volume=Math.max(0,v0*(1-k/6));if(k>=6){clearInterval(f);bgm.el.src=MUSIC_DIR+encodeURIComponent(t)+'.mp3';bgm.el.volume=.55;bgm.el.play().catch(()=>{})}},60)}
document.addEventListener('pointerdown',()=>{if(!bgm.unlocked){bgm.unlocked=true;bgmFor(S.step)}},{capture:true});
function muteBtn(){const b=$('#mbtn');if(b)b.textContent=bgm.muted?'靜音':'音樂'}
$('#mbtn').onclick=e=>{e.stopPropagation();bgm.muted=!bgm.muted;try{localStorage.setItem(KEY+'-mute',bgm.muted?'1':'0')}catch(err){};muteBtn();bgm.unlocked=true;bgmFor(S.step)};muteBtn();

/* ---------- compass ---------- */
let heading=null,compassListening=false;
const DIRS=['北','東北','東','東南','南','西南','西','西北'];
function onOri(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;if(h==null)return;
 const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;heading=(h+ang+360)%360;drawDial()}
function drawDial(){const cv=$('#dial');if(!cv)return;const c=cv.getContext('2d'),R=110,cx=120,cy=120;c.clearRect(0,0,240,240);c.imageSmoothingEnabled=false;
 c.fillStyle='#0f1638';c.beginPath();c.arc(cx,cy,R+6,0,7);c.fill();c.strokeStyle='#ffd75a';c.lineWidth=6;c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();
 c.save();c.translate(cx,cy);c.rotate(-(heading||0)*Math.PI/180);
 for(let i=0;i<72;i++){c.save();c.rotate(i*5*Math.PI/180);c.fillStyle=i%18===0?'#ffd75a':(i%2?'#3a4896':'#8a9cf0');c.fillRect(-2,-R+6,4,i%18===0?16:(i%2?6:10));c.restore()}
 c.font='24px FP';c.textAlign='center';c.textBaseline='middle';
 [['北',0,'#ff6a6a'],['東',90,'#fff'],['南',180,'#fff'],['西',270,'#fff']].forEach(([t,a,col])=>{c.save();c.rotate(a*Math.PI/180);c.translate(0,-R+38);c.rotate(-a*Math.PI/180+(heading||0)*Math.PI/180);c.fillStyle=col;c.fillText(t,0,0);c.restore()});
 c.restore();
 c.fillStyle='#ff6a6a';c.beginPath();c.moveTo(cx,cy-R+28);c.lineTo(cx-10,cy);c.lineTo(cx+10,cy);c.fill();c.fillStyle='#cfd8ff';c.beginPath();c.moveTo(cx,cy+R-28);c.lineTo(cx-10,cy);c.lineTo(cx+10,cy);c.fill();
 c.fillStyle='#ffd75a';c.beginPath();c.arc(cx,cy,7,0,7);c.fill();
 $('#heading').textContent=heading==null?'－':`手機上緣朝向：${DIRS[Math.round(heading/45)%8]}　${Math.round(heading)}°`}
async function startCompass(){try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){$('#compassNote').textContent='沒有拿到方向權限。重新整理後再按一次，跳出詢問時選「允許」。';return}}
  if(!compassListening){if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOri);else window.addEventListener('deviceorientation',onOri);compassListening=true}
  try{localStorage.setItem(KEY+'-compass','1')}catch(e){}
  $('#compassStart').style.display='none';
  setTimeout(()=>{if(heading==null)$('#compassNote').textContent='讀不到方向。這支手機可能沒有方向感應器，請改用手機內建的指南針。'},3000)
 }catch(e){$('#compassNote').textContent='讀不到方向，請改用手機內建的指南針。'}}
function openCompass(){$('#compass').classList.add('on');drawDial();
 let auto=false;try{auto=localStorage.getItem(KEY+'-compass')==='1'}catch(e){}
 const needsPerm=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
 if(compassListening){$('#compassStart').style.display='none'}else if(auto&&!needsPerm){startCompass()}else{$('#compassStart').style.display='block'}}
function closeCompass(){$('#compass').classList.remove('on')}
$('#compassClose').onclick=closeCompass;$('#compassStart').onclick=startCompass;

/* ---------- go ---------- */
document.fonts&&document.fonts.load('24px FP').finally(render);if(!document.fonts)render();
</script>
</body>
</html>
